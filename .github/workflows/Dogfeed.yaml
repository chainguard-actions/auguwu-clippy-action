name: Dogfeed
on:
    workflow_dispatch:
    push:
        branches:
            - master
        paths-ignore:
            - '.github/**'
            - '.vscode/**'
            - '.husky/**'
            - '.eslintignore'
            - '.gitignore'
            - 'build/**'
            - '**.md'
            - 'LICENSE'
            - 'renovate.json'

    pull_request:
        types: [opened, synchronize]
        paths-ignore:
            - '.vscode/**'
            - '.husky/**'
            - '.eslintignore'
            - '.gitignore'
            - '**.md'
            - 'LICENSE'
            - 'renovate.json'
permissions:
    checks: write
jobs:
    lint:
        name: Dogfeed
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
            - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
              with:
                  toolchain: stable
                  components: clippy, rustfmt

            - uses: ./
              with:
                  working-directory: ./tests/__fixtures__/no-clippy-error
                  all-features: true
                  token: ${{github.token}}
                  deny: warnings

            - uses: ./
              with:
                  working-directory: ./tests/__fixtures__/unbased-codebase
                  all-features: true
                  allow: clippy::eq_op
                  token: ${{github.token}}
