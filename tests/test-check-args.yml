name: Test check-args input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Rust stable toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable --component clippy
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Copy fixture Rust project to workspace
        run: |
          cp -r "$GITHUB_WORKSPACE/tests/fixtures/rust-project-with-tests" /tmp/rust-project-with-tests

      - id: action
        uses: .
        with:
          token: ${{ github.token }}
          working-directory: /tmp/rust-project-with-tests
          check-args: '--tests'

      - name: Assert clippy ran with check-args successfully
        run: |
          echo "Clippy action with --tests check-args completed without error"
          echo "PASS"
