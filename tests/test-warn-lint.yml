name: Test warn lint input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Rust stable toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Run clippy-action with warn lint
        id: clippy
        uses: .
        with:
          token: ${{ github.token }}
          working-directory: ${{ github.workspace }}/tests/fixtures/rust-project
          warn: unused_imports,dead_code

      - name: Assert clippy ran successfully with warn lints
        run: |
          echo "Clippy action with warn lints completed successfully"
          echo "PASS"
