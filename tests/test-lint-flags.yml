name: Test lint flag inputs (allow/deny/warn)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Rust stable toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable --component clippy
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Copy fixture Rust project to workspace
        run: |
          cp -r "$GITHUB_WORKSPACE/tests/fixtures/rust-project" /tmp/rust-project-lint

      - id: action
        uses: .
        with:
          token: ${{ github.token }}
          working-directory: /tmp/rust-project-lint
          allow: 'dead_code'
          warn: 'unused_variables'

      - name: Assert clippy ran with lint flags successfully
        run: |
          echo "Clippy action with allow/warn lint flags completed without error"
          echo "PASS"
